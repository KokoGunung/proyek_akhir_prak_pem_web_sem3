<div class="flex flex-col w-full px-margin pt-4 gap-space-md">
  <h1 class="font-headline-xl-mobile text-headline-xl-mobile text-primary">Beli Tiket</h1>

  <form id="form-beli" class="flex flex-col gap-space-md bg-surface-container-lowest rounded-xl p-5 shadow-sm" novalidate>
    <label class="flex flex-col gap-1.5">
      <span class="font-label-md text-label-md text-on-surface-variant">Asal</span>
      <select id="asal" class="w-full h-12 px-4 rounded-lg bg-surface border border-outline-variant font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container"></select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="font-label-md text-label-md text-on-surface-variant">Tujuan</span>
      <select id="tujuan" class="w-full h-12 px-4 rounded-lg bg-surface border border-outline-variant font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container"></select>
    </label>
    <div class="flex flex-col gap-1.5">
      <span class="font-label-md text-label-md text-on-surface-variant">Penumpang</span>
      <div class="flex items-center justify-between h-12 px-1 rounded-lg bg-surface border border-outline-variant">
        <button type="button" id="kurang" aria-label="Kurangi" class="w-10 h-10 flex items-center justify-center rounded-lg text-primary hover:bg-surface-container transition-colors"><span class="material-symbols-outlined">remove</span></button>
        <span id="jumlah" class="font-label-lg text-label-lg text-primary">1</span>
        <button type="button" id="tambah" aria-label="Tambah" class="w-10 h-10 flex items-center justify-center rounded-lg text-primary hover:bg-surface-container transition-colors"><span class="material-symbols-outlined">add</span></button>
      </div>
    </div>
    <div class="flex items-center justify-between px-space-sm py-3 rounded-lg bg-surface-container-low">
      <span class="font-body-md text-body-md text-on-surface-variant">Total</span>
      <span class="font-title-station text-title-station text-secondary">Rp <span id="total"></span></span>
    </div>
    <p id="pesan" class="hidden font-body-sm text-body-sm" style="color:#ba1a1a;"></p>
    <button type="submit" class="h-12 rounded-lg bg-secondary-container hover:bg-secondary text-on-secondary font-label-lg text-label-lg transition-colors">Bayar</button>
  </form>
</div>
</main>

<script>
  var MAKS_PENUMPANG = 5;
  var jumlah = 1;
  var elAsal = document.getElementById("asal");
  var elTujuan = document.getElementById("tujuan");
  var elPesan = document.getElementById("pesan");

  // Isi pilihan stasiun
  DAFTAR_STASIUN.forEach(function (st) {
    elAsal.add(new Option(st.nama, st.kode));
    elTujuan.add(new Option(st.nama, st.kode));
  });
  elAsal.value = "YK";
  elTujuan.value = "SLO";

  function tampilkanTotal() {
    document.getElementById("jumlah").textContent = jumlah;
    document.getElementById("total").textContent = rupiah(TARIF * jumlah);
  }

  function sembunyikanPesan() {
    elPesan.classList.add("hidden");
  }

  document.getElementById("kurang").addEventListener("click", function () {
    if (jumlah > 1) jumlah--;
    tampilkanTotal();
  });
  document.getElementById("tambah").addEventListener("click", function () {
    if (jumlah < MAKS_PENUMPANG) jumlah++;
    tampilkanTotal();
  });
  elAsal.addEventListener("change", sembunyikanPesan);
  elTujuan.addEventListener("change", sembunyikanPesan);

  document.getElementById("form-beli").addEventListener("submit", function (e) {
    e.preventDefault();

    if (elAsal.value === elTujuan.value) {
      elPesan.textContent = "Stasiun asal dan tujuan tidak boleh sama.";
      elPesan.classList.remove("hidden");
      return;
    }

    if (!kurangiSaldo(TARIF * jumlah)) {
      elPesan.innerHTML = 'Saldo tidak cukup. <a href="topup.html" class="font-semibold underline">Top up</a>';
      elPesan.classList.remove("hidden");
      return;
    }

    simpanTiket({ asal: elAsal.value, tujuan: elTujuan.value, jumlah: jumlah });
    kodeTiket(true);
    window.location.href = "etiket.html";
  });

  tampilkanTotal();
</script>
