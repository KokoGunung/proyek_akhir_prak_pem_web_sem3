<link href="css/style.css" rel="stylesheet"/><script src="js/auth.js"></script></head><body data-halaman="login" class="bg-background font-body-md text-on-surface antialiased flex flex-col min-h-screen">
<main class="flex-1 flex items-center justify-center px-margin py-10">
  <div class="w-full max-w-sm flex flex-col gap-space-md">
    <div class="flex flex-col items-center gap-space-sm">
      <div class="w-14 h-14 rounded-xl bg-primary-container flex items-center justify-center">
        <span class="material-symbols-outlined text-[30px] text-secondary-container">train</span>
      </div>
      <h1 class="font-headline-lg text-headline-lg text-primary">KRL Jogja - Solo</h1>
    </div>
    <form id="form-login" class="flex flex-col gap-space-sm bg-surface-container-lowest rounded-xl p-5 shadow-sm" novalidate>
      <label class="flex flex-col gap-1.5">
        <span class="font-label-md text-label-md text-on-surface-variant">Nama pengguna</span>
        <input id="nama" type="text" autocomplete="username" class="w-full h-12 px-4 rounded-lg bg-surface border border-outline-variant font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container"/>
      </label>
      <label class="flex flex-col gap-1.5">
        <span class="font-label-md text-label-md text-on-surface-variant">Kata sandi</span>
        <input id="sandi" type="password" autocomplete="current-password" class="w-full h-12 px-4 rounded-lg bg-surface border border-outline-variant font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container"/>
      </label>
      <p id="pesan-error" class="hidden font-body-sm text-body-sm" style="color:#ba1a1a;"></p>
      <button type="submit" class="h-12 rounded-lg bg-secondary-container hover:bg-secondary text-on-secondary font-label-lg text-label-lg transition-colors">Masuk</button>
    </form>
  </div>
</main>
<script>
  document.getElementById("form-login").addEventListener("submit", function (e) {
    e.preventDefault();
    var pesan = masuk(document.getElementById("nama").value, document.getElementById("sandi").value);
    var elPesan = document.getElementById("pesan-error");
    if (pesan) {
      elPesan.textContent = pesan;
      elPesan.classList.remove("hidden");
    } else {
      window.location.href = "index.html";
    }
  });
</script>
</body></html>
